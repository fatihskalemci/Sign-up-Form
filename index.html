<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="left-side column">
    <div class="logo">
      <img src="image/odin-lined.png" alt="">
      <p>ODIN</p>
    </div>
  </div>
  <form class="column right-side" action="">
    <div class="info row">
      <p>This is not a real online service! You know you need something
        this in your life to help you realize your deepest dreams.
        Sign up <em>now</em> to get started
      </p>
      <p>You <em>know</em> you want to.</p>
    </div>
    <div class="inputs row">
      <h1>Let's do this!</h1>
      <div class="input-group">
        <div class="name-inputs mini-group">
          <label for="first-name">FIRST NAME
            <input type="text" id="first-name" name="first-name">
          </label>
          <label for="last-name">LAST NAME
            <input type="text" id="last-name" name="last-name">
          </label>
        </div>
        <div class="contact-inputs mini-group">
          <label for="email">EMAIL
            <input type="email" id="email" name="email">
          </label>
          <label for="phone-number">PHONE NUMBER
            <input type="tel" id="phone-number" name="phone-number">
          </label>
        </div>
        <div class="passwords mini-group">
          <label for="password">PASSWORD
            <input type="password"
                   id="password"
                   name="password"
                   required>
          </label>
          <label for="confirm-password">CONFIRM PASSWORD
            <input type="password"
                   id="confirm-password"
                   name="confirm-password"
                   required>
          </label>
        </div>
      </div>
    </div>
    <div class="buttons row">
      <button type="submit">Create Account</button>
      <p>Already have an acoount? <a href="">Log in</a></p>
    </div>
  </form>
</body>
</html>
